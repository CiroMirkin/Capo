name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            # `next build` y los e2e corren en modo invitado, pero el middleware de
            # Auth.js exige un secret y el adapter de Prisma exige DATABASE_URL en
            # tiempo de módulo. Valores de descarte: no se abre ninguna conexión.
            AUTH_SECRET: e2e-ci-not-a-real-secret
            AUTH_TRUST_HOST: 'true'
            DATABASE_URL: postgresql://user:pass@localhost:5432/capo_ci
        defaults:
            run:
                working-directory: web-app
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: 'npm'
                  cache-dependency-path: web-app/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps chromium firefox
            - name: Build app (producción, sin compilación lazy en los e2e)
              run: npm run build
            - name: Run tests
              run: npm run test:all
            - name: Release
              run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
