<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capo · Fecha límite: componentes y funciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · C4 nivel 4 (código)</p>
    <h1>Fecha límite: componentes y funciones</h1>

    <svg viewBox="0 0 960 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fl-title fl-desc">

      <desc id="fl-desc">Al crear la tarea, AddNewTaskInput usa el DatePicker compartido y llama a getNewTask, que valida con isValidDueDate. Al renderizar la tarjeta, BlankTask llama a getDueDateDisplay y pinta el resultado en DueDateSlot.</desc>

        <marker id="fl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="44" y="48" width="872" height="260" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <text x="60" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CREAR · AL AGREGAR LA TAREA</text>

      <text x="60" y="349" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MOSTRAR · EN LA TARJETA</text>

      <!-- Arrows -->
      <!-- A. AddNewTaskInput -> DatePicker -->
      <line x1="272" y1="138" x2="380" y2="138" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#fl-arrow)"/>
      <rect x="294" y="116" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="326" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">dateControl</text>

      <!-- B. AddNewTaskInput -> getNewTask -->

      <rect x="304" y="228" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="326" y="237" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">valida</text>

      <!-- D. BlankTask -> getDueDateDisplay -->

      <rect x="302" y="400" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="326" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">computa</text>

      <!-- E. getDueDateDisplay -> DueDateSlot -->

      <rect x="628" y="404" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="666" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DueDateDisplay</text>

      <!-- F. BlankTask -> DueDateSlot (ruta por debajo) -->
      <path d="M 172,464 V 512 Q 172,520 180,520 H 804 Q 812,520 812,512 V 468" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#fl-arrow)"/>
      <rect x="464" y="498" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="507" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">renderiza</text>

      <line x1="82" y1="254" x2="262" y2="254" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>

      <text x="84" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">throws BusinessError</text>

      <!-- isValidDueDate -->
      <rect x="380" y="212" width="220" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="212" width="220" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>

      <text x="409" y="229" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="490" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">isValidDueDate</text>
      <line x1="390" y1="254" x2="590" y2="254" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="392" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">YYYY-MM-DD · fecha real · ≥ hoy</text>
      <text x="392" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ boolean</text>

      <!-- BlankTask -->
      <rect x="72" y="388" width="200" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="388" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="80" y="396" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>

      <line x1="82" y1="430" x2="262" y2="430" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="84" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">data · isLastColumn</text>
      <text x="84" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">context · archivedDate</text>

      <!-- getDueDateDisplay (focal) -->
      <rect x="380" y="380" width="240" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="380" width="240" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="388" y="388" width="42" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>

      <!-- DueDateSlot -->

      <rect x="720" y="396" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="730" y="405" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="812" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DueDateSlot</text>
      <line x1="722" y1="430" x2="902" y2="430" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="724" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">{ display, open }</text>
      <text x="724" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">&lt;span&gt; texto plano · opacity-40</text>

      <!-- Legend -->
      <line x1="44" y1="606" x2="916" y2="606" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="44" y="626" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="120" y="618" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entrada / lógica central</text>

      <rect x="308" y="618" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="328" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Componente React</text>

      <rect x="468" y="618" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="488" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Función de dominio (pura)</text>

      <line x1="672" y1="623" x2="698" y2="623" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#fl-arrow)"/>
      <text x="704" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">llama / depende de</text>

  </div>
</body>
</html>
