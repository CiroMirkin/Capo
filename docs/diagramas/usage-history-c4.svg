  <text x="188" y="578" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UsageHistory</text>
  <line x1="86" y1="586" x2="290" y2="586" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
  <text x="88" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">montado en /time/[id]</text>
  <text x="88" y="612" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Spinner · vacío · días al revés</text>

  <!-- UsageRecord · Period -->
  <rect x="452" y="544" width="320" height="84" rx="6" fill="#f5f5f5"/>
  <rect x="452" y="544" width="320" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="460" y="552" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="470" y="561" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
  <text x="612" y="578" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UsageRecord · Period</text>
  <line x1="462" y1="586" x2="762" y2="586" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
  <text x="464" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">por día ▸ por sesión · períodos al revés</text>
  <text x="464" y="612" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">parseDuration HH:MM:SS · formatDate · formatTime</text>

  <!-- Legend -->
  <line x1="44" y1="700" x2="916" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="44" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

  <rect x="120" y="712" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
