  <rect x="84" y="224" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="110" y="233" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USECASE</text>
  <text x="188" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">updateDailyUsageRecord</text>
  <line x1="86" y1="258" x2="290" y2="258" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
  <text x="88" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">({ duration, usageHistory })</text>
  <text x="88" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ UsageHistory (nuevo array)</text>
  <text x="88" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">día nuevo · período nuevo · extiende</text>

  <!-- needsNewUsageSession -->
  <rect x="400" y="224" width="236" height="76" rx="6" fill="#f5f5f5"/>
  <rect x="400" y="224" width="236" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="408" y="232" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
  <text x="429" y="241" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
  <text x="518" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">needsNewUsageSession</text>
  <line x1="410" y1="266" x2="626" y2="266" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
  <text x="412" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">(lastDay): boolean</text>
  <text x="412" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">inactividad &gt; 25 min → período nuevo</text>

  <!-- useUsageHistoryQuery (seam) -->
  <rect x="356" y="352" width="288" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="356" y="352" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="364" y="360" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="381" y="369" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
  <text x="500" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">useUsageHistoryQuery</text>
  <line x1="366" y1="394" x2="634" y2="394" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
  <text x="368" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">usageHistory · updateUsageHistory · isSaving</text>
  <text x="368" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TanStack Query — query + mutation</text>
  <text x="368" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">repo dual: sesión ? actions Prisma : localStorage</text>
  <text x="368" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">clave [userId, boardId] · migra al leer/escribir</text>

