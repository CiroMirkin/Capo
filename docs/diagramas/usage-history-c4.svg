  <rect x="84" y="100" width="34" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="101" y="109" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
  <text x="188" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">useSaveTimeTracking</text>
  <line x1="86" y1="134" x2="290" y2="134" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
  <text x="88" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">providers → ClientOnlyInit</text>
  <text x="88" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">setInterval · resetea al cambiar board</text>

  <!-- useTimeTracking -->
  <rect x="400" y="92" width="236" height="84" rx="6" fill="#f5f5f5"/>
  <rect x="400" y="92" width="236" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="408" y="100" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="425" y="109" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
  <text x="518" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">useTimeTracking</text>
  <line x1="410" y1="134" x2="626" y2="134" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
