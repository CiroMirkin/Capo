<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uhc-title uhc-desc">
  <title id="uhc-title">Código de la feature de registro de uso</title>
  <desc id="uhc-desc">Al escribir, useSaveTimeTracking lee el tiempo de useTimeTracking, lo pasa por updateDailyUsageRecord (que consulta needsNewUsageSession) y lo guarda con useUsageHistoryQuery. Al leer, la pantalla /time/[id] renderiza UsageHistory y luego UsageRecord · Period a partir del mismo hook.</desc>

  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="uhc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Zones -->
  <rect x="44" y="48" width="872" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="54" y="52" width="248" height="12" rx="2" fill="#f5f5f5"/>
  <text x="60" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ESCRIBIR · TRACKING EN SEGUNDO PLANO</text>

  <rect x="44" y="500" width="872" height="240" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="54" y="504" width="192" height="12" rx="2" fill="#f5f5f5"/>
  <text x="60" y="513" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEER · PANTALLA /time/[id]</text>

  <!-- Arrows -->
  <!-- A. useSaveTimeTracking -> useTimeTracking -->
  <line x1="300" y1="130" x2="400" y2="130" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#uhc-arrow)"/>
  <rect x="313" y="112" width="74" height="12" rx="2" fill="#f5f5f5"/>
  <text x="350" y="121" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">getTotalTime</text>

  <!-- B. useSaveTimeTracking -> updateDailyUsageRecord -->
  <line x1="120" y1="176" x2="120" y2="216" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#uhc-arrow)"/>
  <rect x="128" y="190" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="150" y="199" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">60,5 s</text>

  <!-- C. updateDailyUsageRecord -> needsNewUsageSession -->
  <line x1="300" y1="262" x2="400" y2="262" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#uhc-arrow)"/>
  <rect x="316" y="244" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="340" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">consulta</text>

  <!-- D. useSaveTimeTracking -> useUsageHistoryQuery -->
  <path d="M 76,140 H 68 Q 60,140 60,148 V 396 Q 60,404 68,404 H 356" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#uhc-arrow)"/>
  <rect x="68" y="192" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="72" y="201" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">escribe</text>

  <!-- E. UsageHistory -> useUsageHistoryQuery -->
  <path d="M 188,544 V 492 Q 188,484 196,484 H 492 Q 500,484 500,476 V 456" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#uhc-arrow)"/>
  <rect x="196" y="500" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="204" y="509" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">usageHistory</text>

  <!-- F. UsageHistory -> UsageRecord · Period -->
  <line x1="300" y1="586" x2="452" y2="586" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#uhc-arrow)"/>
  <rect x="352" y="568" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="380" y="577" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">renderiza</text>

