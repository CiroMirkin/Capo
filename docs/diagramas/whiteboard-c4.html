  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      margin-bottom: 0.5rem;

    h1 {
      font-family: var(--font-serif);

      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 840px; display: block; }

      <desc id="wb-desc">Whiteboard carga la escena con useWhiteboard y recién entonces renderiza WhiteboardCanvas (Excalidraw); cada onChange pasa por toStoredScene y vuelve al hook, que guarda con debounce de 1 s y flush al salir, validando con isValidScene. El hook usa whiteboardRepositoryFactory: con sesión, la server action saveWhiteboard revalida y hace upsert en prisma.whiteboard; como invitado, localStorage capo-whiteboard. El botón de fondo de WhiteboardCanvas setea la preferencia compartida usePageSurface, que aplica PageContainer con allowSurface.</desc>
