<?xml version="1.0" encoding="UTF-8"?>
    <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="st-title st-desc">
      <title id="st-title">Código de la feature de sub-tareas</title>
      <desc id="st-desc">AddSubtaskButton arma una hija y la manda a addTaskInFirstColumn, que chequea isThisParentWithinTheChildrenLimit antes de agregarla; ese guard, deleteThisTask e isTaskReadyToArchiveIndividually se apoyan en el helper base getChildrenOfTaskInBoard, que también alimenta el texto del padre y el número de hijas que pinta BlankTask.</desc>

      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="st-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="44" y="52" width="872" height="172" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="54" y="56" width="146" height="12" rx="2" fill="#f5f5f5"/>
      <text x="60" y="65" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ALTA DE UNA HIJA</text>

      <rect x="44" y="248" width="872" height="312" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="54" y="252" width="290" height="12" rx="2" fill="#f5f5f5"/>
      <text x="60" y="261" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CASCADA · ARCHIVADO · CARD (VÍA EL HUB)</text>

      <!-- Arrows -->
      <!-- A. AddSubtaskButton -> addTaskInFirstColumn -->
      <line x1="280" y1="130" x2="388" y2="130" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#st-arrow)"/>
      <rect x="292" y="118" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="334" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">arma hija</text>

      <!-- B. addTaskInFirstColumn -> isThisParentWithinTheChildrenLimit -->
      <line x1="600" y1="130" x2="684" y2="130" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#st-arrow)"/>
      <rect x="606" y="118" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">si parentId</text>

      <!-- G. isThisParentWithinTheChildrenLimit -> AddSubtaskButton (BusinessError, toast) -->
      <path d="M 800,168 V 198 Q 800,206 792,206 H 184 Q 176,206 176,198 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#st-arrow)"/>
      <rect x="424" y="194" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BusinessError → toast</text>

      <!-- C. isThisParentWithinTheChildrenLimit -> getChildrenOfTaskInBoard -->
      <path d="M 800,168 V 272 Q 800,280 792,280 H 496 Q 488,280 488,288 V 300" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#st-arrow)"/>
      <rect x="598" y="268" width="78" height="12" rx="2" fill="#f5f5f5"/>
      <text x="637" y="277" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cuenta hijas</text>

      <!-- D. deleteThisTask -> getChildrenOfTaskInBoard -->
      <path d="M 176,468 V 400 Q 176,392 184,392 H 472 Q 480,392 480,384 V 376" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#st-arrow)"/>
      <rect x="222" y="386" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="278" y="395" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hijas a cascadear</text>

      <!-- E. isTaskReadyToArchiveIndividually -> getChildrenOfTaskInBoard -->
      <line x1="490" y1="468" x2="486" y2="376" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#st-arrow)"/>
      <rect x="500" y="410" width="102" height="12" rx="2" fill="#f5f5f5"/>
      <text x="551" y="419" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">¿le quedan hijas?</text>

      <!-- F. getChildrenOfTaskInBoard -> BlankTask -->
      <path d="M 586,330 H 792 Q 800,330 800,338 V 468" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#st-arrow)"/>
      <rect x="700" y="416" width="188" height="12" rx="2" fill="#f5f5f5"/>
      <text x="794" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">childrenCount / parentDescription</text>

      <!-- Nodes -->
      <!-- AddSubtaskButton (focal) -->
      <rect x="72" y="92" width="208" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="92" width="208" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="80" y="100" width="20" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="90" y="109" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="176" y="126" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AddSubtaskButton</text>
      <line x1="82" y1="134" x2="270" y2="134" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="84" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">oculto si data.parentId</text>
      <text x="84" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Popover · mismo input que crear tarea</text>

      <!-- addTaskInFirstColumn (focal, reusado) -->
      <rect x="388" y="92" width="212" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="388" y="92" width="212" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="396" y="100" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="422" y="109" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USE CASE</text>
      <text x="494" y="126" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">addTaskInFirstColumn</text>
      <line x1="398" y1="134" x2="590" y2="134" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="400" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">reusado de "crear tarea"</text>
      <text x="400" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">+ guard nuevo si task.parentId</text>

      <!-- isThisParentWithinTheChildrenLimit -->
      <rect x="684" y="92" width="232" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="684" y="92" width="232" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="692" y="100" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="713" y="109" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="800" y="126" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">isThisParentWithinTheChildrenLimit</text>
      <line x1="694" y1="134" x2="906" y2="134" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="696" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">CHILDREN_LIMIT = 20</text>
      <text x="696" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">&gt;= 20 → BusinessError</text>

      <!-- getChildrenOfTaskInBoard (hub) -->
      <rect x="374" y="300" width="212" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="374" y="300" width="212" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="382" y="308" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="403" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="480" y="334" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">getChildrenOfTaskInBoard</text>
      <line x1="384" y1="342" x2="576" y2="342" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="386" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">aplana el tablero, filtra parentId</text>
      <text x="386" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">helper base — todo lo demás se apoya acá</text>

      <!-- deleteThisTask -->
      <rect x="72" y="468" width="208" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="468" width="208" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="80" y="476" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="106" y="485" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USE CASE</text>
      <text x="176" y="502" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">deleteThisTask</text>
      <line x1="82" y1="510" x2="270" y2="510" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="84" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">borra tarea + hijas, cualquier columna</text>
      <text x="84" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">sin hijas → no-op extra (igual que antes)</text>

      <!-- isTaskReadyToArchiveIndividually -->
      <rect x="388" y="468" width="212" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="388" y="468" width="212" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="396" y="476" width="42" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="417" y="485" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="494" y="502" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">isTaskReadyToArchiveIndividually</text>
      <line x1="398" y1="510" x2="590" y2="510" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="400" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">hija: true · padre: sin hijas en tablero</text>
      <text x="400" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">misma base en splitLastColumnByArchiveReadiness</text>

      <!-- BlankTask -->
      <rect x="684" y="468" width="232" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="684" y="468" width="232" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="692" y="476" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="702" y="485" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="800" y="502" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BlankTask</text>
      <line x1="694" y1="510" x2="906" y2="510" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="696" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">props nuevas, solo con la card abierta</text>
      <text x="696" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">calculadas en Task.tsx · no en el archivo</text>

      <!-- Legend -->
      <line x1="44" y1="606" x2="916" y2="606" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="44" y="626" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="120" y="618" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entrada / lógica reusada de crear tarea</text>

      <rect x="380" y="618" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Componente · caso de uso consumidor</text>

      <rect x="626" y="618" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="646" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Función de dominio</text>

      <line x1="812" y1="623" x2="838" y2="623" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#st-arrow)"/>
      <text x="844" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">llama / produce</text>
    </svg>
