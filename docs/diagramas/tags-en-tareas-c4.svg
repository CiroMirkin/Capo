    <svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt-title tt-desc">
      <title id="tt-title">Código de la feature de agregar/quitar tags en una tarea existente</title>
      <desc id="tt-desc">AddTagButton, acción de la tarjeta en TaskInBoardActions, lee los tags disponibles con useActualTagGroup y al tildar/destildar uno llama a addTagInThisTask, que arma la nueva lista de columnas y la persiste con updateTaskBoard (saveTaskBoard, ya existente).</desc>

      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="tt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone -->
      <rect x="44" y="48" width="872" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="54" y="52" width="300" height="12" rx="2" fill="#f5f5f5"/>
      <text x="60" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AGREGAR / QUITAR TAG · DESDE LA TARJETA</text>

      <!-- Arrows -->
      <!-- A. AddTagButton -> useActualTagGroup -->
      <line x1="272" y1="126" x2="380" y2="126" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#tt-arrow)"/>
      <rect x="288" y="104" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="326" y="113" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">lee tags</text>

      <!-- B. AddTagButton -> addTagInThisTask -->
      <line x1="172" y1="164" x2="172" y2="220" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#tt-arrow)"/>
      <rect x="180" y="184" width="46" height="12" rx="2" fill="#f5f5f5"/>
      <text x="203" y="193" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">toggle</text>

      <!-- C. addTagInThisTask -> updateTaskBoard -->
      <line x1="272" y1="258" x2="380" y2="258" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#tt-arrow)"/>
      <rect x="280" y="236" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TaskListInEachColumn</text>

      <!-- D. updateTaskBoard -> saveTaskBoard -->
      <line x1="620" y1="258" x2="712" y2="258" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#tt-arrow)"/>
      <rect x="628" y="236" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="654" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">persiste</text>

      <!-- Nodes -->
      <!-- AddTagButton (focal) -->
      <rect x="72" y="88" width="200" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="88" width="200" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="80" y="96" width="26" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="93" y="105" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="172" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AddTagButton</text>
      <line x1="82" y1="130" x2="262" y2="130" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="84" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Popover + CheckboxBadge</text>
      <text x="84" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">taskList/components</text>

      <!-- useActualTagGroup -->
      <rect x="380" y="88" width="220" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="88" width="220" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="388" y="96" width="46" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="411" y="105" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHARED</text>
      <text x="490" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">useActualTagGroup</text>
      <line x1="390" y1="130" x2="590" y2="130" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="392" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ TagGroup traducido</text>
      <text x="392" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">feature tags · hook</text>

      <!-- addTagInThisTask -->
      <rect x="72" y="220" width="200" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="220" width="200" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="80" y="228" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="101" y="237" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="172" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">addTagInThisTask</text>
      <line x1="82" y1="262" x2="262" y2="262" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="84" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">map inmutable por id</text>
      <text x="84" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">taskList/useCase</text>

      <!-- updateTaskBoard -->
      <rect x="380" y="220" width="220" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="220" width="220" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="388" y="228" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="398" y="237" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="490" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">updateTaskBoard</text>
      <line x1="390" y1="262" x2="590" y2="262" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="392" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">react-query, optimista</text>
      <text x="392" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">hooks/useTaskBoardQuery</text>

      <!-- saveTaskBoard (ya existente) -->
      <rect x="712" y="220" width="200" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="220" width="200" height="76" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.4)" stroke-width="1" stroke-dasharray="3 2"/>
      <rect x="720" y="228" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="730" y="237" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="812" y="254" fill="rgba(45,49,66,0.7)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">saveTaskBoard</text>
      <line x1="722" y1="262" x2="902" y2="262" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="724" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">full-sync, sin cambios</text>
      <text x="724" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">api/actions (ya existía)</text>

      <!-- Legend -->
      <line x1="44" y1="308" x2="916" y2="308" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="44" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="120" y="320" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="328" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entrada / lógica central</text>

      <rect x="308" y="320" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="328" y="328" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Componente / hook</text>

      <rect x="468" y="320" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="488" y="328" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Función de dominio (pura)</text>

      <rect x="672" y="320" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.4)" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="692" y="328" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ya existente, sin cambios</text>
    </svg>
