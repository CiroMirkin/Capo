<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capo · Crear una tarea: componentes y funciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · C4 nivel 4 (código)</p>
    <h1>Crear una tarea: componentes y funciones</h1>

    <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ct-title ct-desc">
      <title id="ct-title">Código de la feature de creación de tareas</title>
      <desc id="ct-desc">AddNewTaskInput valida la descripción con getNewTask y compone el historial; addTaskInFirstColumn agrega la tarea a la primera columna y chequea el límite de 15; sortListOfTasksInColumnsByPriority la ordena por prioridad y updateTaskBoard / saveTaskBoard la persiste.</desc>

      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="ct-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="44" y="52" width="872" height="172" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="54" y="56" width="228" height="12" rx="2" fill="#f5f5f5"/>
      <text x="60" y="65" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ARMAR Y VALIDAR LA TAREA</text>

      <rect x="44" y="248" width="872" height="312" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="54" y="252" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="60" y="261" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AGREGAR · ORDENAR · PERSISTIR</text>

      <!-- Arrows -->
      <!-- A. AddNewTaskInput -> getNewTask -->
      <line x1="280" y1="130" x2="388" y2="130" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ct-arrow)"/>
      <rect x="310" y="118" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="334" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">valida</text>

      <!-- B. getNewTask -> addChangeToTaskTimelineHistory -->
      <line x1="600" y1="130" x2="684" y2="130" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ct-arrow)"/>
      <rect x="606" y="118" width="66" height="12" rx="2" fill="#f5f5f5"/>
      <text x="639" y="127" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">+ historial</text>

      <!-- C. AddNewTaskInput -> addTaskInFirstColumn -->
      <line x1="252" y1="168" x2="252" y2="302" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ct-arrow)"/>
      <rect x="260" y="228" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="237" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tarea armada</text>

      <!-- D. addTaskInFirstColumn -> isThisTaskListWithinTheLimit -->
      <line x1="280" y1="338" x2="388" y2="338" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ct-arrow)"/>
      <rect x="300" y="326" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="326" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">chequea</text>

      <!-- E. addTaskInFirstColumn -> sortListOfTasksInColumnsByPriority (ruta por debajo) -->
      <path d="M 176,376 V 408 Q 176,416 184,416 H 792 Q 800,416 800,408 V 380" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ct-arrow)"/>
      <rect x="454" y="404" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="490" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">lista nueva</text>

      <!-- F. sortListOfTasksInColumnsByPriority -> useTaskBoardQuery (ruta por debajo) -->
      <path d="M 820,376 V 442 Q 820,450 812,450 H 352 Q 344,450 344,458 V 468" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ct-arrow)"/>
      <rect x="470" y="438" width="118" height="12" rx="2" fill="#f5f5f5"/>
      <text x="529" y="447" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">updateTaskBoard(lista)</text>

      <!-- G. useTaskBoardQuery -> saveTaskBoard -->
      <line x1="452" y1="506" x2="560" y2="506" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ct-arrow)"/>
      <rect x="470" y="494" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="502" y="503" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">repo dual</text>

      <!-- Nodes -->
      <!-- AddNewTaskInput (focal) -->
      <rect x="72" y="92" width="208" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="92" width="208" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="80" y="100" width="20" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>

      <text x="84" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">handleClick()</text>
      <text x="84" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">useState: desc · dueDate · tags</text>

      <!-- getNewTask -->
      <rect x="388" y="92" width="212" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="388" y="92" width="212" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>

      <text x="400" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">descr. no vacía · máx 200 · dueDate?</text>
      <text x="400" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ taskModel · throws BusinessError</text>

      <!-- addChangeToTaskTimelineHistory -->
      <rect x="684" y="92" width="232" height="76" rx="6" fill="#f5f5f5"/>

      <line x1="694" y1="134" x2="906" y2="134" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="696" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">columnName de la 1ª columna</text>
      <text x="696" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ primera entrada del registro</text>

      <!-- addTaskInFirstColumn (focal) -->
      <rect x="72" y="300" width="208" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="300" width="208" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="80" y="308" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="106" y="317" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USE CASE</text>
      <text x="176" y="334" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">addTaskInFirstColumn</text>
      <line x1="82" y1="342" x2="270" y2="342" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="84" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">append a la columna 0 (inmutable)</text>
      <text x="84" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ TaskListInEachColumn</text>

      <!-- isThisTaskListWithinTheLimit -->
      <rect x="388" y="300" width="212" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="388" y="300" width="212" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="396" y="308" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="417" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="494" y="334" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">isThisTaskListWithinTheLimit</text>
      <line x1="398" y1="342" x2="590" y2="342" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="400" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TASK_LIST_LIMIT = 15</text>
      <text x="400" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">&gt; 15 → BusinessError "columna llena"</text>

      <!-- sortListOfTasksInColumnsByPriority -->
      <rect x="684" y="300" width="232" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="684" y="300" width="232" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="692" y="308" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="713" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="800" y="334" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sortListOfTasksInColumnsByPriority</text>
      <line x1="694" y1="342" x2="906" y2="342" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="696" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">ordena cada columna por prioridad</text>
      <text x="696" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">tarea sin etiqueta → al final</text>

      <!-- useTaskBoardQuery -->
      <rect x="236" y="468" width="216" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="236" y="468" width="216" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="244" y="476" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="261" y="485" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
      <text x="344" y="502" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">useTaskBoardQuery</text>
      <line x1="246" y1="510" x2="442" y2="510" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="248" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">updateTaskBoard (optimista)</text>
      <text x="248" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">react-query · onError revierte</text>

      <!-- saveTaskBoard -->
      <rect x="560" y="468" width="232" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="468" width="232" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="476" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="581" y="485" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="676" y="502" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">saveTaskBoard</text>
      <line x1="570" y1="510" x2="782" y2="510" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="572" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">invitado → localStorage</text>
      <text x="572" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">sesión → server action full-sync</text>

      <!-- Legend -->
      <line x1="44" y1="606" x2="916" y2="606" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="44" y="626" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="120" y="618" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entrada / lógica central</text>

      <rect x="300" y="618" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Componente · hook · API</text>

      <rect x="486" y="618" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>

  </div>
</body>
</html>
