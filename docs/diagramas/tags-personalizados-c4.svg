<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ctp-title ctp-desc">
      <title id="ctp-title">Código de la feature de tags personalizados del board</title>
      <desc id="ctp-desc">CreateCustomTags usa useCustomTagsQuery, que llama a customTagRepositoryFactory para leer y guardar vía getCustomTagGroup/saveCustomTagGroup sobre un TagGroup propio del board (boardId único); getActiveTagGroup, ya existente, ahora lee ese mismo TagGroup junto a los grupos sembrados.</desc>

      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="ctp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone -->
      <rect x="24" y="48" width="852" height="552" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="34" y="52" width="300" height="12" rx="2" fill="#f5f5f5"/>
      <text x="40" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CREAR / EDITAR MIS TAGS · SETTINGS</text>

      <!-- Arrows -->
      <!-- 1. CreateCustomTags -> useCustomTagsQuery -->
      <line x1="240" y1="126" x2="320" y2="126" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ctp-arrow)"/>
      <rect x="262" y="104" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="113" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">usa</text>

      <!-- 2. useCustomTagsQuery -> customTagRepositoryFactory (fetch) -->
      <line x1="392" y1="164" x2="392" y2="228" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ctp-arrow)"/>
      <rect x="402" y="190" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="199" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fetch</text>

      <!-- 3. useCustomTagsQuery -> customTagRepositoryFactory (save) -->
      <line x1="468" y1="164" x2="468" y2="228" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ctp-arrow)"/>
      <rect x="478" y="190" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="496" y="199" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">save</text>

      <!-- 4. customTagRepositoryFactory -> getCustomTagGroup -->
      <path d="M 392,304 V 328 Q 392,336 384,336 H 268 Q 260,336 260,344 V 368" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ctp-arrow)"/>
      <rect x="308" y="316" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="326" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">llama</text>

      <!-- 5. customTagRepositoryFactory -> saveCustomTagGroup -->
      <path d="M 468,304 V 328 Q 468,336 476,336 H 552 Q 560,336 560,344 V 368" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ctp-arrow)"/>
      <rect x="496" y="316" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="514" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">llama</text>

      <!-- 6. getCustomTagGroup -> TagGroup -->
      <path d="M 260,444 V 468 Q 260,476 268,476 H 372 Q 380,476 380,484 V 508" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ctp-arrow)"/>
      <rect x="302" y="456" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="465" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">lee</text>

      <!-- 7. saveCustomTagGroup -> TagGroup -->
      <path d="M 560,444 V 468 Q 560,476 552,476 H 456 Q 448,476 448,484 V 508" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ctp-arrow)"/>
      <rect x="482" y="456" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="465" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">escribe</text>

      <!-- 8. getActiveTagGroup -> TagGroup -->
      <line x1="600" y1="546" x2="512" y2="546" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ctp-arrow)"/>
      <rect x="532" y="524" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="533" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">lee todos</text>

      <!-- Nodes -->
      <!-- 1. CreateCustomTags -->
      <rect x="40" y="88" width="200" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="88" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="96" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="61" y="105" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="140" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CreateCustomTags</text>
      <line x1="50" y1="130" x2="230" y2="130" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="52" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">form · + UserCustomTagList</text>
      <text x="52" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">features/tags/ui</text>

      <!-- 2. useCustomTagsQuery -->
      <rect x="320" y="88" width="220" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="88" width="220" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="96" width="42" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="349" y="105" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
      <text x="430" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">useCustomTagsQuery</text>
      <line x1="330" y1="130" x2="530" y2="130" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="332" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">{ customTags, updateCustomTags }</text>
      <text x="332" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">features/tags/hooks</text>

      <!-- 3. customTagRepositoryFactory -->
      <rect x="320" y="228" width="220" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="228" width="220" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="328" y="236" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="349" y="245" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
      <text x="430" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">customTagRepositoryFactory</text>
      <line x1="330" y1="270" x2="530" y2="270" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="332" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">fetchCustomTags · saveCustomTags</text>
      <text x="332" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">api/repository · Nextjs vs LocalStorage</text>

      <!-- 4. getCustomTagGroup -->
      <rect x="160" y="368" width="200" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="368" width="200" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="168" y="376" width="46" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="191" y="385" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTION</text>
      <text x="260" y="402" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">getCustomTagGroup</text>
      <line x1="170" y1="410" x2="350" y2="410" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="172" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">(boardId) → TagGroup | null</text>
      <text x="172" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">api/actions</text>

      <!-- 5. saveCustomTagGroup -->
      <rect x="460" y="368" width="200" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="368" width="200" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="468" y="376" width="46" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="491" y="385" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTION</text>
      <text x="560" y="402" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">saveCustomTagGroup</text>
      <line x1="470" y1="410" x2="650" y2="410" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="472" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">(boardId, tags) → void</text>
      <text x="472" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">api/actions · tagGroup.upsert</text>

      <!-- 6. TagGroup (focal) -->
      <rect x="312" y="508" width="200" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="312" y="508" width="200" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="320" y="516" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="344" y="525" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="412" y="542" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TagGroup</text>
      <line x1="322" y1="550" x2="502" y2="550" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="324" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">boardId String? @unique</text>
      <text x="324" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">schema.prisma</text>

      <!-- 7. getActiveTagGroup (focal, ya existía) -->
      <rect x="600" y="508" width="220" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="508" width="220" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="608" y="516" width="46" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="631" y="525" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTION</text>
      <text x="710" y="542" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">getActiveTagGroup</text>
      <line x1="610" y1="550" x2="810" y2="550" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="612" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">boardId null OR boardId</text>
      <text x="612" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">api/actions · ya existía</text>

      <!-- Legend -->
      <line x1="24" y1="620" x2="876" y2="620" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="640" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="140" y="632" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="160" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dato compartido / integración existente</text>

      <rect x="420" y="632" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">UI / hook</text>

      <rect x="560" y="632" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="580" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Repositorio / server action</text>
    </svg>
