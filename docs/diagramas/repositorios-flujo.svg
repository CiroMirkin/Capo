<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 772" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rf-title rf-desc">
      <title id="rf-title">Flujo de una llamada al repositorio</title>
      <desc id="rf-desc">El hook llama a fetchX o saveX de la fábrica, que arma el repositorio con la fuente que elige bySession. El repositorio llama a read o write de esa fuente. Con sesión, ServerActionDataSource importa la server action, que valida el acceso y escribe con Prisma. Como invitado, LocalStorageDataSource guarda JSON en localStorage. Al costado, qué hace getAll, el save por snapshot y el save por diff del tablero.</desc>

